name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # vet on linux silently skips every file behind a windows build tag, and
      # roughly a third of this tree is windows-only. Compiling for windows in the
      # next step catches type errors but not the class of mistake vet looks for.
      - name: vet for windows
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: test
        run: go test ./... -race -timeout 120s

      - name: shell scripts parse
        run: |
          for f in hack/*.sh; do
            sh -n "$f" || exit 1
          done

      - name: build every target
        run: make build

      - name: the built binaries run
        run: |
          ./dist/sercond-linux-amd64 version
          ./dist/sercon-linux-amd64 version
          ./dist/sercond-linux-amd64 list
